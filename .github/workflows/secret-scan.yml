# Fails the workflow when the pull request or push diff contains a secret.
# gitleaks is pinned in scripts/gitleaks-install.sh. Every scan passes --redact.

name: Secret scan

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          trap 'rm -rf "$bindir"' EXIT
          scripts/gitleaks-install.sh "$bindir"
          export PATH="$bindir:$PATH"
          scripts/secret-scan-diff.sh
