# After CI, Fly preview, or Secret scan, download that run's job logs and
# scan them with gitleaks --no-git --redact. Raw logs are not echoed or uploaded.
# They are deleted before the job exits.
#
# workflow_run runs this file from the default branch only. Until this workflow
# is on main, it does not fire. workflow_dispatch scans one completed run by id
# so the same job can be exercised from a branch.
#
# GitHub stores logs after masking registered Actions secrets, so a value that
# was already replaced with *** is not visible here. Artifacts, caches, Fly
# machine logs, and step summaries are outside this job.

name: Secret scan logs

on:
  workflow_run:
    workflows:
      - CI
      - Fly preview
      - Secret scan
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Numeric workflow run id whose logs to scan
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  secret-scan-logs:
    name: secret-scan-logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Scan workflow logs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
          INPUT_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || '' }}
        run: |
          set -euo pipefail
          bindir="$(mktemp -d)"
          trap 'rm -rf "$bindir"' EXIT
          scripts/gitleaks-install.sh "$bindir"
          export PATH="$bindir:$PATH"
          scripts/secret-scan-logs.sh
